# GitHub Actions - Windows 构建工作流
name: Build Windows Installer

on:
  push:
    branches: [ main, maxian-agent-release, day2-complete-kilocode-migration, plan-f-direct-import ]
  pull_request:
    branches: [ main, maxian-agent-release ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: 安装依赖
      run: npm install
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    - name: 下载内置扩展
      run: npm run download-builtin-extensions
      continue-on-error: true

    - name: 构建 Windows 客户端 (x64)
      run: |
        npm run gulp vscode-win32-x64-min
      env:
        VSCODE_MIXIN_PASSWORD: placeholder

    - name: 验证构建输出
      run: |
        $buildDir = Join-Path (Split-Path $pwd -Parent) "VSCode-win32-x64"
        Write-Host "检查构建目录: $buildDir"
        if (Test-Path $buildDir) {
          Write-Host "✅ 构建目录存在"
          Get-ChildItem $buildDir -Recurse -Depth 2 | Select-Object -First 20
          $productJson = Join-Path $buildDir "resources\app\product.json"
          if (Test-Path $productJson) {
            Write-Host "✅ product.json 存在"
          } else {
            Write-Host "❌ product.json 不存在"
            exit 1
          }
        } else {
          Write-Host "❌ 构建目录不存在: $buildDir"
          Write-Host "当前目录内容:"
          Get-ChildItem (Split-Path $pwd -Parent)
          exit 1
        }
      shell: pwsh

    - name: 复制 Inno Updater
      run: npm run gulp vscode-win32-x64-inno-updater

    - name: 生成系统级安装包
      run: npm run gulp vscode-win32-x64-system-setup

    - name: 生成用户级安装包
      run: npm run gulp vscode-win32-x64-user-setup

    - name: 上传系统级安装包
      uses: actions/upload-artifact@v4
      with:
        name: tianhe-zhikai-system-setup-x64
        path: .build/win32-x64/system-setup/MaxianSetup.exe
        if-no-files-found: error

    - name: 上传用户级安装包
      uses: actions/upload-artifact@v4
      with:
        name: tianhe-zhikai-user-setup-x64
        path: .build/win32-x64/user-setup/MaxianSetup.exe
        if-no-files-found: error

    - name: 打包绿色版（便携版）
      run: |
        $buildDir = Join-Path (Split-Path $pwd -Parent) "VSCode-win32-x64"
        Write-Host "打包目录: $buildDir"
        Compress-Archive -Path $buildDir -DestinationPath tianhe-zhikai-portable-x64.zip
      shell: pwsh

    - name: 上传绿色版
      uses: actions/upload-artifact@v4
      with:
        name: tianhe-zhikai-portable-x64
        path: tianhe-zhikai-portable-x64.zip
        if-no-files-found: error

    - name: 构建信息
      run: |
        echo "构建完成！"
        echo "系统级安装包: .build/win32-x64/system-setup/MaxianSetup.exe"
        echo "用户级安装包: .build/win32-x64/user-setup/MaxianSetup.exe"
        echo "绿色版（便携版）: tianhe-zhikai-portable-x64.zip"
        dir .build\win32-x64\system-setup\
        dir .build\win32-x64\user-setup\
        dir tianhe-zhikai-portable-x64.zip
