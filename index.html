<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天和·灵枢运营驾驶舱</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- 背景层 -->
        <div class="background-layer">
            <div class="bg-element bg-1"></div>
            <div class="bg-element bg-2"></div>
        </div>

        <!-- 数字人展示区域 -->
        <div class="digital-human-section">
            <div class="human-avatar avatar-1"></div>
            <div class="human-avatar avatar-2"></div>
            <div class="video-display"></div>
        </div>

        <!-- 主要内容模块 -->
        <div class="main-content">
            <!-- 模块1 - 数据统计 -->
            <div class="data-module module-1">
                <div class="module-border">
                    <div class="border-element border-top-left"></div>
                    <div class="border-element border-top-right"></div>
                    <div class="border-element border-bottom-left"></div>
                    <div class="border-element border-bottom-right"></div>
                    
                    <!-- 数据指标组1 -->
                    <div class="data-group group-1">
                        <div class="metric-item">
                            <div class="metric-icon icon-1"></div>
                            <div class="metric-info">
                                <div class="metric-label">总用户数</div>
                                <div class="metric-value">1,045</div>
                            </div>
                        </div>
                        
                        <div class="metric-item">
                            <div class="metric-icon icon-2"></div>
                            <div class="metric-info">
                                <div class="metric-label">活跃用户</div>
                                <div class="metric-value">823</div>
                            </div>
                        </div>
                        
                        <div class="metric-item">
                            <div class="metric-icon icon-3"></div>
                            <div class="metric-info">
                                <div class="metric-label">新增用户</div>
                                <div class="metric-value">127</div>
                            </div>
                        </div>
                    </div>

                    <!-- 数据指标组2 -->
                    <div class="data-group group-2">
                        <div class="metric-item">
                            <div class="metric-icon icon-4"></div>
                            <div class="metric-info">
                                <div class="metric-label">转化率</div>
                                <div class="metric-value">23.5%</div>
                            </div>
                        </div>
                        
                        <div class="metric-item">
                            <div class="metric-icon icon-5"></div>
                            <div class="metric-info">
                                <div class="metric-label">满意度</div>
                                <div class="metric-value">96.8%</div>
                            </div>
                        </div>
                        
                        <div class="metric-item">
                            <div class="metric-icon icon-6"></div>
                            <div class="metric-info">
                                <div class="metric-label">响应时间</div>
                                <div class="metric-value">0.2s</div>
                            </div>
                        </div>
                    </div>

                    <!-- 图表区域 -->
                    <div class="chart-area">
                        <div class="chart-placeholder">
                            <div class="chart-bar bar-1"></div>
                            <div class="chart-bar bar-2"></div>
                            <div class="chart-bar bar-3"></div>
                            <div class="chart-bar bar-4"></div>
                            <div class="chart-bar bar-5"></div>
                        </div>
                    </div>

                    <!-- 统计卡片 -->
                    <div class="stats-card card-1">
                        <div class="card-header">
                            <div class="card-title">今日概览</div>
                            <div class="card-subtitle">Today Overview</div>
                        </div>
                        <div class="card-content">
                            <div class="stat-number">1,245</div>
                            <div class="stat-desc">访问量</div>
                        </div>
                    </div>

                    <div class="stats-card card-2">
                        <div class="card-header">
                            <div class="card-title">实时在线</div>
                            <div class="card-subtitle">Online Users</div>
                        </div>
                        <div class="card-content">
                            <div class="stat-number">342</div>
                            <div class="stat-desc">用户数</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
